# Glance configuration for attentiond.
#
# Run it standalone:
#
#   glance --config glance/attentiond.yml
#
# Or copy the widgets under `widgets:` into a column of your own glance.yml.
#
# Glance fetches the JSON server-side, so `url` is the address attentiond
# listens on. The action buttons are submitted by the browser, so they use the
# absolute URLs attentiond puts in each item, built from its --public-url.

pages:
  - name: Work
    columns:
      - size: full
        widgets:
          - type: custom-api
            title: Needs attention
            cache: 5s
            url: http://127.0.0.1:7717/api/attention
            template: |
              {{ $items := .JSON.Array "items" }}
              {{ if eq (len $items) 0 }}
                <p class="color-positive">Nothing is waiting on you.</p>
              {{ else }}
              <ul class="list list-gap-14">
                {{ range $items }}
                <li>
                  <div class="flex items-center gap-10">
                    <span class="size-h6 shrink-0 color-negative">{{ .String "state" }}</span>
                    <span class="grow text-truncate color-highlight">{{ .String "title" }}</span>
                    <span class="size-h6 shrink-0 color-paragraph" {{ .String "updated_at" | parseTime "rfc3339" | toRelativeTime }}></span>
                  </div>
                  <ul class="list-horizontal-text margin-top-3">
                    <li class="color-paragraph">{{ .String "source" }}</li>
                    {{ range .Array "actions" }}
                    <li>
                      {{ if eq (.String "method") "GET" }}
                        <a class="color-highlight" href="{{ .String "href" }}" target="_blank">{{ .String "label" }}</a>
                      {{ else }}
                        <form method="post" action="{{ .String "href" }}" target="attentiond-action">
                          <button type="submit" class="color-highlight" style="background:none;border:0;padding:0;font:inherit;cursor:pointer">{{ .String "label" }}</button>
                        </form>
                      {{ end }}
                    </li>
                    {{ end }}
                  </ul>
                </li>
                {{ end }}
              </ul>
              {{ end }}
              {{/* Actions POST into this hidden frame so clicking one does not navigate the dashboard away. */}}
              <iframe name="attentiond-action" title="attentiond actions" hidden style="display:none"></iframe>

          - type: custom-api
            title: All work
            cache: 5s
            url: http://127.0.0.1:7717/api/work
            template: |
              {{ $items := .JSON.Array "items" }}
              {{ if eq (len $items) 0 }}
                <p class="color-paragraph">Nothing in flight.</p>
              {{ else }}
              <ul class="list list-gap-10 collapsible-container" data-collapse-after="8">
                {{ range $items }}
                {{ $attention := .Bool "attention" }}
                <li class="flex items-center gap-10">
                  <span class="size-h6 shrink-0 {{ if $attention }}color-negative{{ else if eq (.String "state") "working" }}color-highlight{{ else }}color-paragraph{{ end }}">{{ .String "state" }}</span>
                  <span class="grow text-truncate {{ if $attention }}color-highlight{{ end }}">{{ .String "title" }}</span>
                  <span class="size-h6 shrink-0 color-paragraph" {{ .String "updated_at" | parseTime "rfc3339" | toRelativeTime }}></span>
                </li>
                {{ end }}
              </ul>
              {{ end }}
